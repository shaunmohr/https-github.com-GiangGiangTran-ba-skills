- 'PDCAScreen As screen':
    Properties:
      Fill: =gblColPageBg
      OnVisible: |
        =// Default to last 30 days
        UpdateContext({
            locPDCAFrom: DateAdd(Today(), -30, Days),
            locPDCATo:   Today(),
            locPDCAPeriod: "Last 30 days"
        });
        // Load PDCA dataset
        ClearCollect(colPDCAData,
            Filter(EnabledTasks,
                Site = gblCurrentSite &&
                PlannedEndDate >= locPDCAFrom &&
                PlannedEndDate <= locPDCATo
            )
        )
    Children:

    # ── HEADER ────────────────────────────────────────────────────────────────
    - 'PDCA_Header_Rect As rectangle':
        Properties:
          X: =0
          Y: =0
          Width: =Parent.Width
          Height: =90
          Fill: =gblColHeaderBg

    - 'PDCA_Back_Btn As button':
        Properties:
          Text: ="< Home"
          X: =8
          Y: =30
          Width: =80
          Height: =36
          Color: =RGBA(255, 255, 255, 1)
          Fill: =RGBA(0, 0, 0, 0)
          BorderColor: =RGBA(0, 0, 0, 0)
          Size: =13
          OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)

    - 'PDCA_Title As label':
        Properties:
          Text: ="PDCA — Enabling Task Analysis"
          X: =80
          Y: =30
          Width: =Parent.Width - 96
          Height: =36
          Color: =RGBA(255, 255, 255, 1)
          FontWeight: =FontWeight.Bold
          Size: =15
          VerticalAlign: =VerticalAlign.Middle

    # ── PERIOD SELECTOR ───────────────────────────────────────────────────────
    - 'PDCA_Period_Gallery As gallery':
        Properties:
          Items: =["Last 7 days", "Last 30 days", "Last 90 days"]
          X: =8
          Y: =98
          Width: =Parent.Width - 16
          Height: =36
          TemplateSize: =(Parent.Width - 16) / 3
          TemplatePadding: =4
          Layout: =Layout.Horizontal
          ShowScrollbar: =false
          OnSelect: |
            =UpdateContext({
                locPDCAPeriod: ThisItem.Value,
                locPDCAFrom:   Switch(ThisItem.Value,
                                   "Last 7 days",  DateAdd(Today(), -7,  Days),
                                   "Last 30 days", DateAdd(Today(), -30, Days),
                                   "Last 90 days", DateAdd(Today(), -90, Days)
                               ),
                locPDCATo: Today()
            });
            ClearCollect(colPDCAData,
                Filter(EnabledTasks,
                    Site = gblCurrentSite &&
                    PlannedEndDate >= locPDCAFrom &&
                    PlannedEndDate <= locPDCATo
                )
            )
        Children:
        - 'PDCA_Period_Rect As rectangle':
            Properties:
              X: =0
              Y: =0
              Width: =Parent.TemplateWidth - 8
              Height: =32
              Fill: =If(ThisItem.Value = locPDCAPeriod, gblColBHPRed, gblColCardBg)
              BorderColor: =If(ThisItem.Value = locPDCAPeriod, gblColBHPRed, gblColBorder)
              BorderThickness: =1
              RadiusTopLeft: =6
              RadiusTopRight: =6
              RadiusBottomLeft: =6
              RadiusBottomRight: =6
        - 'PDCA_Period_Label As label':
            Properties:
              Text: =ThisItem.Value
              X: =0
              Y: =4
              Width: =Parent.TemplateWidth - 8
              Height: =24
              Align: =Align.Center
              Size: =11
              Color: =If(ThisItem.Value = locPDCAPeriod, RGBA(255,255,255,1), gblColTextPrimary)
              FontWeight: =If(ThisItem.Value = locPDCAPeriod, FontWeight.Bold, FontWeight.Normal)

    # ── KPI CARDS ROW 1 ───────────────────────────────────────────────────────
    - 'PDCA_KPI_TotalTasks_Rect As rectangle':
        Properties:
          X: =8
          Y: =144
          Width: =(Parent.Width - 24) / 2
          Height: =78
          Fill: =gblColCardBg
          BorderColor: =gblColBorder
          BorderThickness: =1
          RadiusTopLeft: =8
          RadiusTopRight: =8
          RadiusBottomLeft: =8
          RadiusBottomRight: =8
    - 'PDCA_KPI_TotalTasks_Num As label':
        Properties:
          Text: =Text(CountRows(colPDCAData))
          X: =8
          Y: =152
          Width: =(Parent.Width - 24) / 2
          Height: =36
          Align: =Align.Center
          FontWeight: =FontWeight.Bold
          Size: =28
          Color: =gblColTextPrimary
    - 'PDCA_KPI_TotalTasks_Lbl As label':
        Properties:
          Text: ="Total Tasks"
          X: =8
          Y: =188
          Width: =(Parent.Width - 24) / 2
          Height: =28
          Align: =Align.Center
          Size: =11
          Color: =gblColTextSecond

    - 'PDCA_KPI_CompRate_Rect As rectangle':
        Properties:
          X: =16 + (Parent.Width - 24) / 2
          Y: =144
          Width: =(Parent.Width - 24) / 2
          Height: =78
          Fill: =gblColCardBg
          BorderColor: =gblColBorder
          BorderThickness: =1
          RadiusTopLeft: =8
          RadiusTopRight: =8
          RadiusBottomLeft: =8
          RadiusBottomRight: =8
    - 'PDCA_KPI_CompRate_Num As label':
        Properties:
          Text: |
            =If(
                CountRows(colPDCAData) = 0,
                "—",
                Text(
                    Round(CountRows(Filter(colPDCAData, Status = "Complete")) / CountRows(colPDCAData) * 100, 0)
                ) & "%"
            )
          X: =16 + (Parent.Width - 24) / 2
          Y: =152
          Width: =(Parent.Width - 24) / 2
          Height: =36
          Align: =Align.Center
          FontWeight: =FontWeight.Bold
          Size: =28
          Color: |
            =If(CountRows(colPDCAData) = 0, gblColTextSecond,
                If(
                    CountRows(Filter(colPDCAData, Status = "Complete")) / CountRows(colPDCAData) >= 0.90,
                    gblColGreen,
                    If(
                        CountRows(Filter(colPDCAData, Status = "Complete")) / CountRows(colPDCAData) >= 0.75,
                        gblColAmber,
                        gblColRed
                    )
                )
            )
    - 'PDCA_KPI_CompRate_Lbl As label':
        Properties:
          Text: ="Completion Rate"
          X: =16 + (Parent.Width - 24) / 2
          Y: =188
          Width: =(Parent.Width - 24) / 2
          Height: =28
          Align: =Align.Center
          Size: =11
          Color: =gblColTextSecond

    # KPI Row 2
    - 'PDCA_KPI_OnTime_Rect As rectangle':
        Properties:
          X: =8
          Y: =232
          Width: =(Parent.Width - 24) / 2
          Height: =78
          Fill: =gblColCardBg
          BorderColor: =gblColBorder
          BorderThickness: =1
          RadiusTopLeft: =8
          RadiusTopRight: =8
          RadiusBottomLeft: =8
          RadiusBottomRight: =8
    - 'PDCA_KPI_OnTime_Num As label':
        Properties:
          Text: |
            =If(
                CountRows(Filter(colPDCAData, Status = "Complete")) = 0,
                "—",
                Text(
                    Round(
                        CountRows(Filter(colPDCAData, Status = "Complete" && (IsBlank(ActualEndDate) || ActualEndDate <= PlannedEndDate))) /
                        CountRows(Filter(colPDCAData, Status = "Complete")) * 100,
                        0
                    )
                ) & "%"
            )
          X: =8
          Y: =240
          Width: =(Parent.Width - 24) / 2
          Height: =36
          Align: =Align.Center
          FontWeight: =FontWeight.Bold
          Size: =28
          Color: |
            =If(CountRows(Filter(colPDCAData, Status = "Complete")) = 0, gblColTextSecond,
                If(
                    CountRows(Filter(colPDCAData, Status = "Complete" && (IsBlank(ActualEndDate) || ActualEndDate <= PlannedEndDate))) /
                    CountRows(Filter(colPDCAData, Status = "Complete")) >= 0.85,
                    gblColGreen,
                    If(
                        CountRows(Filter(colPDCAData, Status = "Complete" && (IsBlank(ActualEndDate) || ActualEndDate <= PlannedEndDate))) /
                        CountRows(Filter(colPDCAData, Status = "Complete")) >= 0.70,
                        gblColAmber,
                        gblColRed
                    )
                )
            )
    - 'PDCA_KPI_OnTime_Lbl As label':
        Properties:
          Text: ="On-Time Delivery"
          X: =8
          Y: =276
          Width: =(Parent.Width - 24) / 2
          Height: =28
          Align: =Align.Center
          Size: =11
          Color: =gblColTextSecond

    - 'PDCA_KPI_Unplanned_Rect As rectangle':
        Properties:
          X: =16 + (Parent.Width - 24) / 2
          Y: =232
          Width: =(Parent.Width - 24) / 2
          Height: =78
          Fill: =gblColCardBg
          BorderColor: =gblColBorder
          BorderThickness: =1
          RadiusTopLeft: =8
          RadiusTopRight: =8
          RadiusBottomLeft: =8
          RadiusBottomRight: =8
    - 'PDCA_KPI_Unplanned_Num As label':
        Properties:
          Text: =Text(CountRows(Filter(colPDCAData, IsUnplanned = true)))
          X: =16 + (Parent.Width - 24) / 2
          Y: =240
          Width: =(Parent.Width - 24) / 2
          Height: =36
          Align: =Align.Center
          FontWeight: =FontWeight.Bold
          Size: =28
          Color: =If(CountRows(Filter(colPDCAData, IsUnplanned = true)) > 5, gblColAmber, gblColTextPrimary)
    - 'PDCA_KPI_Unplanned_Lbl As label':
        Properties:
          Text: ="Unplanned Tasks"
          X: =16 + (Parent.Width - 24) / 2
          Y: =276
          Width: =(Parent.Width - 24) / 2
          Height: =28
          Align: =Align.Center
          Size: =11
          Color: =gblColTextSecond

    # ── SECTION HEADER: DEPARTMENT PERFORMANCE ────────────────────────────────
    - 'PDCA_Dept_Header As label':
        Properties:
          Text: ="Department Performance"
          X: =16
          Y: =322
          Width: =Parent.Width - 32
          Height: =24
          Color: =gblColTextPrimary
          FontWeight: =FontWeight.Bold
          Size: =13

    # Column headers for department table
    - 'PDCA_Dept_ColH_Dept As label':
        Properties:
          Text: ="Department"
          X: =16
          Y: =348
          Width: =Parent.Width - 220
          Height: =20
          Color: =gblColTextSecond
          FontWeight: =FontWeight.Semibold
          Size: =11
    - 'PDCA_Dept_ColH_Tasks As label':
        Properties:
          Text: ="Tasks"
          X: =Parent.Width - 204
          Y: =348
          Width: =48
          Height: =20
          Align: =Align.Center
          Color: =gblColTextSecond
          FontWeight: =FontWeight.Semibold
          Size: =11
    - 'PDCA_Dept_ColH_Done As label':
        Properties:
          Text: ="Done"
          X: =Parent.Width - 156
          Y: =348
          Width: =48
          Height: =20
          Align: =Align.Center
          Color: =gblColTextSecond
          FontWeight: =FontWeight.Semibold
          Size: =11
    - 'PDCA_Dept_ColH_Rate As label':
        Properties:
          Text: ="Rate"
          X: =Parent.Width - 108
          Y: =348
          Width: =48
          Height: =20
          Align: =Align.Center
          Color: =gblColTextSecond
          FontWeight: =FontWeight.Semibold
          Size: =11
    - 'PDCA_Dept_ColH_Delay As label':
        Properties:
          Text: ="Delayed"
          X: =Parent.Width - 60
          Y: =348
          Width: =44
          Height: =20
          Align: =Align.Center
          Color: =gblColTextSecond
          FontWeight: =FontWeight.Semibold
          Size: =11

    # Department performance gallery
    - 'PDCA_Dept_Gallery As gallery':
        Properties:
          Items: =colDepartments
          X: =0
          Y: =368
          Width: =Parent.Width
          Height: =Parent.Height - 530
          TemplateSize: =40
          TemplatePadding: =0
          ShowScrollbar: =true
          Layout: =Layout.Vertical
        Children:
        - 'PDCA_Dept_Row_Bg As rectangle':
            Properties:
              X: =8
              Y: =1
              Width: =Parent.TemplateWidth - 16
              Height: =38
              Fill: =If(Mod(ThisItem.ID, 2) = 0, gblColCardBg, gblColPageBg)
              RadiusTopLeft: =4
              RadiusTopRight: =4
              RadiusBottomLeft: =4
              RadiusBottomRight: =4
        - 'PDCA_Dept_Row_ColorDot As rectangle':
            Properties:
              X: =16
              Y: =13
              Width: =8
              Height: =12
              Fill: =ColorValue(ThisItem.DepartmentColor)
              RadiusTopLeft: =4
              RadiusTopRight: =4
              RadiusBottomLeft: =4
              RadiusBottomRight: =4
        - 'PDCA_Dept_Row_Name As label':
            Properties:
              Text: =ThisItem.Title
              X: =30
              Y: =8
              Width: =Parent.TemplateWidth - 244
              Height: =24
              Color: =gblColTextPrimary
              FontWeight: =FontWeight.Semibold
              Size: =11
              Overflow: =Overflow.Hidden
        - 'PDCA_Dept_Row_Tasks As label':
            Properties:
              Text: =Text(CountRows(Filter(colPDCAData, Department = ThisItem.Title)))
              X: =Parent.TemplateWidth - 204
              Y: =8
              Width: =48
              Height: =24
              Align: =Align.Center
              FontWeight: =FontWeight.Bold
              Size: =13
              Color: =gblColTextPrimary
        - 'PDCA_Dept_Row_Done As label':
            Properties:
              Text: =Text(CountRows(Filter(colPDCAData, Department = ThisItem.Title && Status = "Complete")))
              X: =Parent.TemplateWidth - 156
              Y: =8
              Width: =48
              Height: =24
              Align: =Align.Center
              FontWeight: =FontWeight.Bold
              Size: =13
              Color: =gblColGreen
        - 'PDCA_Dept_Row_Rate As label':
            Properties:
              Text: |
                =If(
                    CountRows(Filter(colPDCAData, Department = ThisItem.Title)) = 0,
                    "—",
                    Text(
                        Round(
                            CountRows(Filter(colPDCAData, Department = ThisItem.Title && Status = "Complete")) /
                            CountRows(Filter(colPDCAData, Department = ThisItem.Title)) * 100,
                            0
                        )
                    ) & "%"
                )
              X: =Parent.TemplateWidth - 108
              Y: =8
              Width: =48
              Height: =24
              Align: =Align.Center
              FontWeight: =FontWeight.Bold
              Size: =13
              Color: |
                =If(
                    CountRows(Filter(colPDCAData, Department = ThisItem.Title)) = 0,
                    gblColTextSecond,
                    If(
                        CountRows(Filter(colPDCAData, Department = ThisItem.Title && Status = "Complete")) /
                        CountRows(Filter(colPDCAData, Department = ThisItem.Title)) >= 0.90,
                        gblColGreen,
                        If(
                            CountRows(Filter(colPDCAData, Department = ThisItem.Title && Status = "Complete")) /
                            CountRows(Filter(colPDCAData, Department = ThisItem.Title)) >= 0.75,
                            gblColAmber,
                            gblColRed
                        )
                    )
                )
        - 'PDCA_Dept_Row_Delayed As label':
            Properties:
              Text: =Text(CountRows(Filter(colPDCAData, Department = ThisItem.Title && Status = "Delayed")))
              X: =Parent.TemplateWidth - 60
              Y: =8
              Width: =44
              Height: =24
              Align: =Align.Center
              FontWeight: =FontWeight.Bold
              Size: =13
              Color: =If(CountRows(Filter(colPDCAData, Department = ThisItem.Title && Status = "Delayed")) > 0, gblColRed, gblColTextSecond)

    # ── TOP DELAY REASONS (Pareto) ────────────────────────────────────────────
    - 'PDCA_Delay_Header As label':
        Properties:
          Text: ="Top Delay Reasons"
          X: =16
          Y: =Parent.Height - 148
          Width: =Parent.Width - 32
          Height: =24
          Color: =gblColTextPrimary
          FontWeight: =FontWeight.Bold
          Size: =13

    - 'PDCA_Delay_Note As label':
        Properties:
          Text: ="For full Pareto analysis, open the Power BI dashboard linked in Teams."
          X: =16
          Y: =Parent.Height - 128
          Width: =Parent.Width - 32
          Height: =20
          Color: =gblColBlue
          Size: =11

    - 'PDCA_PBI_Btn As button':
        Properties:
          Text: ="Open Power BI Dashboard"
          X: =16
          Y: =Parent.Height - 106
          Width: =Parent.Width - 32
          Height: =36
          Fill: =gblColBlue
          Color: =RGBA(255, 255, 255, 1)
          BorderColor: =RGBA(0, 0, 0, 0)
          Size: =13
          FontWeight: =FontWeight.Semibold
          RadiusTopLeft: =8
          RadiusTopRight: =8
          RadiusBottomLeft: =8
          RadiusBottomRight: =8
          OnSelect: =Launch("https://app.powerbi.com/groups/YOUR_WORKSPACE_ID/reports/YOUR_REPORT_ID", {}, LaunchTarget.New)

    # ── BOTTOM NAVIGATION ─────────────────────────────────────────────────────
    - 'PDCA_NavBar As rectangle':
        Properties:
          X: =0
          Y: =Parent.Height - 56
          Width: =Parent.Width
          Height: =56
          Fill: =gblColNavBg

    - 'PDCA_Nav_Home As button':
        Properties:
          Text: ="Home"
          X: =0
          Y: =Parent.Height - 56
          Width: =Parent.Width / 4
          Height: =56
          Color: =gblColNavInactive
          Fill: =RGBA(0,0,0,0)
          BorderColor: =RGBA(0,0,0,0)
          Size: =10
          OnSelect: =Navigate(HomeScreen, ScreenTransition.None)

    - 'PDCA_Nav_Tasks As button':
        Properties:
          Text: ="All Tasks"
          X: =Parent.Width / 4
          Y: =Parent.Height - 56
          Width: =Parent.Width / 4
          Height: =56
          Color: =gblColNavInactive
          Fill: =RGBA(0,0,0,0)
          BorderColor: =RGBA(0,0,0,0)
          Size: =10
          OnSelect: |
            =Set(gblFilterDept, "All");
            Navigate(TaskListScreen, ScreenTransition.None)

    - 'PDCA_Nav_Add As button':
        Properties:
          Text: ="Add Task"
          X: =Parent.Width / 2
          Y: =Parent.Height - 56
          Width: =Parent.Width / 4
          Height: =56
          Color: =gblColNavInactive
          Fill: =RGBA(0,0,0,0)
          BorderColor: =RGBA(0,0,0,0)
          Size: =10
          OnSelect: =Navigate(AddTaskScreen, ScreenTransition.None)

    - 'PDCA_Nav_PDCA As button':
        Properties:
          Text: ="PDCA"
          X: =3 * Parent.Width / 4
          Y: =Parent.Height - 56
          Width: =Parent.Width / 4
          Height: =56
          Color: =gblColNavActive
          Fill: =RGBA(0,0,0,0)
          BorderColor: =RGBA(0,0,0,0)
          Size: =10
          FontWeight: =FontWeight.Bold
          OnSelect: =Navigate(PDCAScreen, ScreenTransition.None)
